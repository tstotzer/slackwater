name: Fork-only issue 440 validation
on:
  push:
    branches:
      - ci/440-proof
      - ci/440-cancel
      - ci/440-read-cancel
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - &a3
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify exact source and fork-only harness scope
        run: |-
          git merge-base --is-ancestor 122eb8bc3446d4c4379d5ce60bb15f361f22cfcb HEAD
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--name-only','122eb8bc3446d4c4379d5ce60bb15f361f22cfcb','HEAD'],text=True).splitlines()
          assert paths == ['.github/workflows/build-binaries.yml','.github/workflows/ci.yml'], paths
          PY
  base_failure:
    if: github.ref == 'refs/heads/ci/440-proof'
    needs: scope
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Cache benchmark data
        id: benchmark-cache
        uses: actions/cache@v6
        with:
          path: .test-cache/codex-440
          key: codex-440-20261108180940210-base-${{ github.run_id }}-${{ github.run_attempt }}
      - &a1
        name: Write synthetic downloaded data
        run: |-
          mkdir -p .test-cache/codex-440
          printf "synthetic-reference-data\n" > .test-cache/codex-440/value.txt
      - &a2
        name: Intentional benchmark failure
        run: exit 1
  fixed_failure:
    if: github.ref == 'refs/heads/ci/440-proof'
    needs: scope
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Restore benchmark data
        id: benchmark-cache
        uses: actions/cache/restore@v6
        with:
          path: .test-cache/codex-440
          key: codex-440-20261108180940210-fixed-${{ github.run_id }}-${{ github.run_attempt }}
      - *a1
      - *a2
      - name: Save benchmark data
        if: ${{ always() && steps.benchmark-cache.outputs.cache-hit != 'true' && steps.benchmark-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v6
        with:
          path: .test-cache/codex-440
          key: ${{ steps.benchmark-cache.outputs.cache-primary-key }}
        id: save
  verify_failure:
    if: always() && github.ref == 'refs/heads/ci/440-proof'
    needs:
      - base_failure
      - fixed_failure
    runs-on: ubuntu-latest
    steps:
      - id: base
        uses: actions/cache/restore@v6
        with:
          path: .test-cache/codex-440
          key: codex-440-20261108180940210-base-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Original failed job did not save
        run: test '${{ steps.base.outputs.cache-hit }}' != true
      - id: fixed
        uses: actions/cache/restore@v6
        with:
          path: .test-cache/codex-440
          key: codex-440-20261108180940210-fixed-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fixed failed job saved complete synthetic data
        run: |-
          test '${{ steps.fixed.outputs.cache-hit }}' = true
          test "$(cat .test-cache/codex-440/value.txt)" = synthetic-reference-data
  exact_hit:
    if: always() && github.ref == 'refs/heads/ci/440-proof'
    needs: fixed_failure
    runs-on: ubuntu-latest
    steps:
      - name: Restore benchmark data
        id: benchmark-cache
        uses: actions/cache/restore@v6
        with:
          path: .test-cache/codex-440
          key: codex-440-20261108180940210-fixed-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require exact hit
        run: test '${{ steps.benchmark-cache.outputs.cache-hit }}' = true
      - name: Save benchmark data
        if: ${{ always() && steps.benchmark-cache.outputs.cache-hit != 'true' && steps.benchmark-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v6
        with:
          path: .test-cache/codex-440
          key: ${{ steps.benchmark-cache.outputs.cache-primary-key }}
        id: save
      - name: Exact hit is not saved again
        run: test '${{ steps.save.outcome }}' = skipped
  missing_restore:
    if: github.ref == 'refs/heads/ci/440-proof'
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Restore benchmark data
        id: benchmark-cache
        uses: actions/cache/restore@v6
        with:
          path: .test-cache/codex-440
          key: codex-440-20261108180940210-missing-${{ github.run_id }}-${{ github.run_attempt }}
        if: ${{ false }}
      - name: Save benchmark data
        if: ${{ always() && steps.benchmark-cache.outputs.cache-hit != 'true' && steps.benchmark-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v6
        with:
          path: .test-cache/codex-440
          key: ${{ steps.benchmark-cache.outputs.cache-primary-key }}
        id: save
      - name: Skipped restore does not attempt an empty-key save
        run: test '${{ steps.save.outcome }}' = skipped
  cancellation:
    if: github.ref == 'refs/heads/ci/440-cancel'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore benchmark data
        id: benchmark-cache
        uses: actions/cache/restore@v6
        with:
          path: .test-cache/codex-440
          key: codex-440-20261108180940210-cancel
      - *a1
      - name: Hold until this proof run is cancelled
        run: sleep 480
      - name: Save benchmark data
        if: ${{ always() && steps.benchmark-cache.outputs.cache-hit != 'true' && steps.benchmark-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v6
        with:
          path: .test-cache/codex-440
          key: ${{ steps.benchmark-cache.outputs.cache-primary-key }}
        id: save
  verify_cancellation:
    if: github.ref == 'refs/heads/ci/440-read-cancel'
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - id: cancelled
        uses: actions/cache/restore@v6
        with:
          path: .test-cache/codex-440
          key: codex-440-20261108180940210-cancel
      - name: Cancelled job retained synthetic data
        run: |-
          test '${{ steps.cancelled.outputs.cache-hit }}' = true
          test "$(cat .test-cache/codex-440/value.txt)" = synthetic-reference-data
  project_checks:
    if: github.ref == 'refs/heads/ci/440-proof'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/codex-440-playwright
    steps:
      - *a3
      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full coverage against unbuilt sources
        run: npm run coverage
      - name: Build all packages and benchmark types
        run: npm run build
      - name: Lint source
        run: npm run lint
      - name: Check fixture consistency
        run: npm run fixtures:check
      - name: Release script checks without publication
        run: npm run test:release
