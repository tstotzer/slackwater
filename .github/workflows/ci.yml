name: React bundle validation
on:
  push:
    branches: [ci/react-scrubber-map-20261120, ci/react-ref-event-probe-20261120]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
      - name: Verify exact candidate source
        run: |
          candidate=475aa98108c519039ac888942409dfff66dda85a
          git merge-base --is-ancestor "$candidate" HEAD
          git diff --exit-code "$candidate" HEAD -- . ':!.github/workflows/ci.yml' ':!.github/workflows/build-binaries.yml'
          test "$(git diff --name-only "$candidate" HEAD | wc -l)" -eq 2
          test ! -d packages/react/dist
      - run: node --version
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Full coverage before workspace builds
        run: npm run coverage
      - run: npm run build
      - run: npm run lint
      - run: npm run test:release
      - name: Verify tracked source remains unchanged
        run: git diff --exit-code
